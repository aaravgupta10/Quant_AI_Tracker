name: Institutional Quant Daily Engine

# 1. The Trigger: Wake up at 4:30 PM IST (11:00 AM UTC), Monday - Friday
on:
  schedule:
    - cron: '0 11 * * 1-5'
  # This line allows you to click a button on GitHub to run it manually anytime
  workflow_dispatch: 

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest # A fast, free Linux server provided by GitHub

    steps:
      # 2. Download your Python scripts to the server
      - name: Checkout Code
        uses: actions/checkout@v3

      # 3. Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 4. Install the tools from your requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Execute the scripts in order, injecting your hidden vault keys
      - name: Run Data Fetcher (Phase 3)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python data_fetcher.py

      - name: Run Quant Engine (Phase 4)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python quant_engine.py